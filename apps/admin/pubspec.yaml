name: nightoutadmin
description: "Nightout admin"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  nightout_core:
    path: ../../packages/nightout_core
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  json_annotation: ^4.12.0
  google_fonts: ^8.2.1
  loader_overlay: ^5.0.0
  phosphor_flutter: ^2.1.0
  
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  shared_preferences: ^2.5.6

